services:
  tannins_front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-https://tanninsapi.murasaki.sbs}
    container_name: tannins_front
    restart: always
    environment:
      - API_URL=${API_URL:-https://tanninsapi.murasaki.sbs}
    ports:
      - "${FRONT_PORT:-80}:80"
    networks:
      - tannins_network

networks:
  tannins_network:
    name: tannins_network
