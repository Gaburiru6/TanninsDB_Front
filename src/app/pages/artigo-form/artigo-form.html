<div class="container">
  <header>
    <h1>TanninsDB</h1>
  </header>

  <div class="form-card">
    <h2>{{ editando ? 'Editar Artigo' : 'Novo Artigo' }}</h2>

    <div *ngIf="error" class="error">{{ error }}</div>

    <form (ngSubmit)="salvar()">
      <div class="form-grid">

        <div class="form-group full">
          <label>Título</label>
          <input [(ngModel)]="artigo.titulo" name="titulo" required />
        </div>

        <div class="form-group full">
          <label>Link (DOI)</label>
          <input [(ngModel)]="artigo.link" name="link" />
        </div>

        <div class="form-group">
          <label>Espécie</label>
          <input [(ngModel)]="artigo.especie" name="especie" required />
        </div>

        <div class="form-group">
          <label>Local</label>
          <input [(ngModel)]="artigo.local" name="local" />
        </div>

        <div class="form-group">
          <label>Parte da Planta</label>
          <input [(ngModel)]="artigo.partePlanta" name="partePlanta" />
        </div>

        <div class="form-group">
          <label>Estação</label>
          <select [(ngModel)]="artigo.estacao" name="estacao">
            <option value="" disabled selected>Selecione...</option>
            <option value="Primavera">Primavera</option>
            <option value="Verão">Verão</option>
            <option value="Outono">Outono</option>
            <option value="Inverno">Inverno</option>
          </select>
        </div>

        <div class="form-group">
          <label>Metodologia</label>
          <input [(ngModel)]="artigo.metodologia" name="metodologia" />
        </div>

        <div class="form-group">
          <label>Tipo de Extração</label>
          <input [(ngModel)]="artigo.tipoExtracao" name="tipoExtracao" />
        </div>

        <div class="form-group">
          <label>Fenólicos Totais</label>
          <input [ngModel]="artigo.fenolicos" (ngModelChange)="tratarNumero('fenolicos', $event)" name="fenolicos" type="text" inputmode="decimal" />
        </div>

        <div class="form-group">
          <label>Taninos Totais</label>
          <input [ngModel]="artigo.taninos" (ngModelChange)="tratarNumero('taninos', $event)" name="taninos" type="text" inputmode="decimal" />
        </div>

        <div class="form-group">
          <label>Taninos Condensados</label>
          <input [ngModel]="artigo.tcondensados" (ngModelChange)="tratarNumero('tcondensados', $event)" name="tcondensados" type="text" inputmode="decimal" />
        </div>

        <div class="form-group">
          <label>Taninos Hidrolisáveis</label>
          <input [ngModel]="artigo.thidrolisaveis" (ngModelChange)="tratarNumero('thidrolisaveis', $event)" name="thidrolisaveis" type="text" inputmode="decimal" />
        </div>

      </div>

      <div class="form-actions">
        <button type="button" (click)="cancelar()" class="btn-secondary">Cancelar</button>
        <button type="submit" [disabled]="loading" class="btn-primary">
          {{ loading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
